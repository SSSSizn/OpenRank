<!doctype html>
<html lang="zh-CN" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OpenRank 智能分析大屏</title>
    <!-- 引入 Bootstrap 5 Dark Mode -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: 增加科技感字体 -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
  </head>
  <body>
    <!-- 背景光效 -->
    <div class="bg-glow"></div>

    <div class="container-fluid dashboard-container">

      <!-- 顶部导航栏 (简化版，仅保留 Logo) -->
      <header class="d-flex justify-content-between align-items-center py-3 mb-4 border-bottom border-secondary header-glass">
        <div class="d-flex align-items-center">
          <div class="logo-box me-3">OR</div>
          <h1 class="h4 m-0 fw-bold text-gradient">OpenRank Visualization <span class="badge bg-primary ms-2" style="font-size: 0.6em; vertical-align: middle;">PRO</span></h1>
        </div>
        <!-- 搜索框已移至下方 Dashboard Grid 中 -->
        <div class="d-flex align-items-center">
             <span id="systemStatusBadge" class="badge bg-success bg-opacity-10 text-success border border-success status-pulse">SYSTEM ONLINE</span>
        </div>
      </header>

      <!-- 主要内容区 -->
      <div class="row g-4">

        <!-- 数据概览 Grid (包含 5个数据卡片 + 1个搜索控制卡片) -->
        <div class="col-12">
          <div class="section-header mb-3">
            <h5 class="text-uppercase text-secondary ls-1"><i class="bi bi-grid-3x3-gap-fill me-2"></i>Mission Control</h5>
          </div>
          <div id="fileSummaries" class="row g-3">
            <!-- JS 将在此处生成 5 个数据卡片 -->
            <!-- JS 将在此处生成第 6 个 Search Card -->
          </div>
        </div>

        <!-- 底部/详情：仓库详情 (Detail) - 初始隐藏或为空 -->
        <div class="col-12">
          <div id="repoDetailSectionTitle" class="section-header mt-4 mb-3 d-flex align-items-center justify-content-between" style="opacity: 0.5;">
            <h5 class="text-uppercase text-secondary ls-1"><i class="bi bi-cpu-fill me-2"></i>Analysis Output</h5>
            <span id="currentRepoBadge" class="badge bg-dark border border-secondary text-secondary d-none">NO TARGET</span>
          </div>

          <!-- 详情渲染区 -->
          <div id="repoDetail" class="repo-detail-wrapper row g-4">
             <!-- 内容将由 JS 动态填充 -->
          </div>
        </div>

      </div>
    </div>

    <!-- 脚本引入 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!-- 使用 wordcloud2.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.1.2/wordcloud2.min.js"></script>
    <script src="/static/js/main.js"></script>
  </body>
</html>
