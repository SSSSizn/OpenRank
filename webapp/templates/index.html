<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OpenRank 数据可视化</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
  </head>
  <body class="p-3">
    <div class="container-fluid">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>OpenRank 数据可视化</h1>
        <div style="width:300px;">
          <form id="searchForm" class="d-flex" onsubmit="return false;">
            <input id="searchInput" class="form-control me-2" placeholder="输入仓库名称查询">
            <button id="searchBtn" class="btn btn-outline-success">查询</button>
          </form>
        </div>
      </div>

      <h4 class="mt-3">数据统计总览</h4>
      <div id="fileSummaries" class="row mb-4"></div>

      <div class="row mt-4">
        <div class="col-12">
          <h4>仓库详情</h4>
          <div id="repoDetail"></div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.1.2/wordcloud2.min.js"></script>
    <script src="/static/js/main.js"></script>
  </body>
</html>
