<!doctype html>
<html lang="zh-CN" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OpenRank 智能分析大屏</title>
    <!-- 引入 Bootstrap 5 Dark Mode -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: 增加科技感字体 -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
  </head>
  <body>
    <!-- 背景光效 -->
    <div class="bg-glow"></div>

    <div class="container-fluid dashboard-container">

      <!-- 顶部导航栏 -->
      <header class="d-flex justify-content-between align-items-center py-3 mb-4 border-bottom border-secondary header-glass">
        <div class="d-flex align-items-center">
          <div class="logo-box me-3">OR</div>
          <h1 class="h4 m-0 fw-bold text-gradient">OpenRank Visualization <span class="badge bg-primary ms-2" style="font-size: 0.6em; vertical-align: middle;">PRO</span></h1>
        </div>

        <div class="search-wrapper position-relative">
          <form id="searchForm" class="d-flex" onsubmit="return false;">
            <div class="input-group">
              <span class="input-group-text bg-transparent border-end-0 text-info">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/></svg>
              </span>
              <input id="searchInput" class="form-control border-start-0 ps-0 text-white" placeholder="SEARCH REPOSITORIES..." autocomplete="off">
              <button id="searchBtn" class="btn btn-outline-info fw-bold">EXECUTE</button>
            </div>
          </form>
          <!-- 搜索下拉结果容器 -->
          <div id="reposList" class="dropdown-menu-dark"></div>
        </div>
      </header>

      <!-- 主要内容区 -->
      <div class="row g-4">

        <!-- 左侧/顶部：数据概览 (Summary) -->
        <div class="col-12">
          <div class="section-header mb-3">
            <h5 class="text-uppercase text-secondary ls-1"><i class="bi bi-grid-3x3-gap-fill me-2"></i>Global Metrics</h5>
          </div>
          <div id="fileSummaries" class="row g-3">
            <!-- 动态生成 -->
          </div>
        </div>

        <!-- 底部/详情：仓库详情 (Detail) -->
        <div class="col-12">
          <div class="section-header mt-4 mb-3 d-flex align-items-center justify-content-between">
            <h5 class="text-uppercase text-secondary ls-1"><i class="bi bi-cpu-fill me-2"></i>Repository Analysis</h5>
            <span id="currentRepoBadge" class="badge bg-dark border border-secondary text-secondary d-none">NO REPO SELECTED</span>
          </div>

          <!-- 详情渲染区 -->
          <div id="repoDetail" class="repo-detail-wrapper row g-4">
             <div class="text-center text-muted py-5 empty-state col-12">
                <div class="spinner-border text-dark mb-3" role="status" style="width: 3rem; height: 3rem; opacity: 0.3;"></div>
                <p>等待查询指令...</p>
                <small>请在右上方搜索框输入仓库名称</small>
             </div>
          </div>
        </div>

      </div>
    </div>

    <!-- 脚本引入 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!-- 使用 wordcloud2.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.1.2/wordcloud2.min.js"></script>
    <script src="/static/js/main.js"></script>
  </body>
</html>
