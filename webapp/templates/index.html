<!doctype html>
<html lang="zh-CN" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Repository Analysis Console</title>
    <!-- 引入 Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="/static/css/style.css" rel="stylesheet">
  </head>
  <body>
    <!-- 背景光效 -->
    <div class="bg-glow"></div>

    <div class="container-fluid dashboard-container">

      <!-- 顶部导航栏 -->
      <header class="d-flex justify-content-between align-items-center py-3 mb-4 border-bottom border-secondary header-glass">
        <div class="d-flex align-items-center">
          <div class="logo-box me-3">DEP</div>
          <h1 class="h4 m-0 fw-bold text-gradient">Repository Dependency Intelligence <span class="badge bg-primary ms-2" style="font-size: 0.6em; vertical-align: middle;">PRO</span></h1>
        </div>
        <div class="d-flex align-items-center gap-3">
             <button id="settingsBtn" class="btn btn-sm btn-outline-info d-flex align-items-center gap-2">
                <i class="bi bi-gear-fill"></i>
                <span class="d-none d-md-inline">AI CONFIG</span>
             </button>
             <div class="text-muted font-monospace d-none d-md-block" style="font-size: 0.8rem;">CORE: ACTIVE</div>
             <span id="systemStatusBadge" class="badge bg-success bg-opacity-10 text-success border border-success status-pulse">SYSTEM ONLINE</span>
        </div>
      </header>

      <!-- 主要内容区 -->
      <div class="row g-4">

        <!-- 数据概览 (Dashboard Grid) -->
        <div class="col-12">
          <div class="section-header mb-3">
            <h5 class="text-uppercase text-secondary ls-1"><i class="bi bi-grid-3x3-gap-fill me-2"></i>Mission Control</h5>
          </div>

          <div id="fileSummaries" class="row g-4 align-items-stretch">
             <!-- JS 动态填充 -->
          </div>
        </div>

        <!-- 底部:仓库详情 -->
        <div class="col-12">
          <div id="repoDetailSectionTitle" class="section-header mt-5 mb-3 d-flex align-items-center justify-content-between" style="opacity: 0.5;">
            <h5 class="text-uppercase text-secondary ls-1"><i class="bi bi-cpu-fill me-2"></i>Analysis Output</h5>
            <span id="currentRepoBadge" class="badge bg-dark border border-secondary text-secondary d-none">NO TARGET</span>
          </div>

          <div id="repoDetail" class="repo-detail-wrapper row g-4 align-items-stretch">
             <!-- JS 动态填充 -->
          </div>
        </div>

      </div>
    </div>

    <!-- AI配置模态框 -->
    <div class="modal fade" id="settingsModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark border border-secondary">
          <div class="modal-header border-secondary">
            <h5 class="modal-title text-gradient">
              <i class="bi bi-cpu-fill me-2"></i>AI MODEL CONFIGURATION
            </h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="settingsForm">
              <div class="mb-3">
                <label class="form-label text-muted font-monospace" style="font-size: 0.85rem;">
                  <i class="bi bi-key-fill me-2"></i>API KEY
                </label>
                <input type="password" class="form-control bg-dark text-white border-secondary" id="apiKeyInput" 
                       placeholder="Enter your API key" style="font-family: 'JetBrains Mono', monospace;">
                <div class="form-text text-muted" style="font-size: 0.75rem;">Your API key will be stored locally</div>
              </div>
              
              <div class="mb-3">
                <label class="form-label text-muted font-monospace" style="font-size: 0.85rem;">
                  <i class="bi bi-link-45deg me-2"></i>BASE URL
                </label>
                <input type="text" class="form-control bg-dark text-white border-secondary" id="baseUrlInput" 
                       placeholder="https://api.siliconflow.cn/v1" style="font-family: 'JetBrains Mono', monospace;">
              </div>
              
              <div class="mb-3">
                <label class="form-label text-muted font-monospace" style="font-size: 0.85rem;">
                  <i class="bi bi-box me-2"></i>MODEL NAME
                </label>
                <input type="text" class="form-control bg-dark text-white border-secondary" id="modelInput" 
                       placeholder="deepseek-ai/DeepSeek-V3.2-Exp" style="font-family: 'JetBrains Mono', monospace;">
              </div>

              <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-glow-action flex-grow-1">
                  <i class="bi bi-check-circle me-2"></i>SAVE CONFIG
                </button>
                <button type="button" class="btn btn-outline-danger" id="clearConfigBtn">
                  <i class="bi bi-trash"></i>
                </button>
              </div>

              <div class="mt-3 p-2 bg-dark bg-opacity-50 border border-secondary rounded">
                <div class="d-flex align-items-center gap-2">
                  <div id="configStatus" class="badge bg-secondary">NOT CONFIGURED</div>
                  <div class="text-muted font-monospace" style="font-size: 0.7rem;">STATUS</div>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- 脚本引入 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.1.2/wordcloud2.min.js"></script>
    <script src="/static/js/main.js"></script>
  </body>
</html>
