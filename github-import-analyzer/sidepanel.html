<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Github PyAnalyzer</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="logo-area">
      <div class="status-dot" id="connection-dot"></div>
      <span class="brand">PY_AGENT <span style="color:var(--neon-blue)">v3.5</span></span>
    </div>
    <button id="btn-settings" class="icon-btn" title="Configuration">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </button>
  </header>

  <main>
    <section class="control-panel">
      <div class="repo-info" id="repo-display">
        <span class="label">TARGET</span>
        <span class="value">Waiting...</span>
      </div>
      <button id="btn-scan" class="cyber-btn">
        <span class="btn-text">SCAN REPO</span>
      </button>
    </section>

    <section class="terminal-container">
      <div class="terminal-header">
        <span class="term-title">SYSTEM_LOGS</span>
        <div class="window-controls"><span></span><span></span><span></span></div>
      </div>
      <div id="terminal-output" class="terminal-body">
        <div class="log-line text-dim">System initialized.</div>
      </div>
    </section>

    <section id="result-section" class="editor-container hidden">
      <div class="editor-tabs">
        <button class="tab active" data-target="req">requirements.txt</button>
        <button class="tab" data-target="dock">Dockerfile</button>
        <div class="spacer"></div>
        <button id="btn-copy" class="action-sm">COPY</button>
        <button id="btn-download" class="action-sm">DOWN</button>
      </div>

      <div class="editor-body">
        <div class="line-numbers">
          <span>1</span>
        </div>
        <pre id="code-req" class="code-content active">...</pre>
        <pre id="code-dock" class="code-content hidden">...</pre>
      </div>

      <div class="analysis-section">
        <button id="btn-ai" class="cyber-btn secondary hidden">
          <span class="btn-text">✨ ANALYZE WITH AI</span>
        </button>

        <div id="ai-insight-box" class="ai-insight hidden">
          <div class="insight-title">ANALYSIS_SUMMARY</div>
          <p id="ai-explanation">...</p>
        </div>
      </div>
    </section>
  </main>

  <div id="settings-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>SYSTEM_CONFIG</h3>
        <button id="close-settings" class="close-btn">×</button>
      </div>
      <div class="modal-body">
        <div class="input-group">
          <label>API Base URL</label>
          <input type="text" id="cfg-url" placeholder="https://api.openai.com/v1" class="cyber-input">
        </div>
        <div class="input-group">
          <label>API Key</label>
          <input type="password" id="cfg-key" placeholder="sk-..." class="cyber-input">
        </div>
        <div class="input-group">
          <label>Model Name</label>
          <input type="text" id="cfg-model" placeholder="gpt-4o" class="cyber-input">
        </div>
      </div>
      <div class="modal-footer">
        <button id="save-settings" class="cyber-btn sm">SAVE_CONFIG</button>
      </div>
    </div>
  </div>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
