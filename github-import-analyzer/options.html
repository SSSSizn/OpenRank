<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Settings</title>
  <style>
    body { padding: 20px; font-family: sans-serif; }
    input { width: 300px; padding: 5px; margin-bottom: 10px; display: block; }
    label { font-weight: bold; display: block; margin-top: 10px;}
    button { padding: 8px 15px; cursor: pointer; background: #2ea44f; color: white; border: none; border-radius: 4px;}
  </style>
</head>
<body>
  <h2>LLM Configuration</h2>
  <label>API Base URL (e.g. https://api.openai.com/v1)</label>
  <input type="text" id="baseUrl" placeholder="https://api.openai.com/v1">

  <label>API Key</label>
  <input type="password" id="apiKey" placeholder="sk-...">

  <label>Model Name (e.g. gpt-4o, deepseek-chat)</label>
  <input type="text" id="model" placeholder="gpt-4o">

  <label>GitHub Token (optional, recommended)</label>
  <input id="githubToken" type="password" placeholder="ghp_..." />


  <button id="save">Save Settings</button>
  <p id="status"></p>
  <script src="options.js"></script>
</body>
</html>
